spring:
  datasource:
    url: jdbc:h2:mem:reservas_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

services:
  habitaciones:
    url: http://localhost:8082

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    com.staysync: WARN
    org.hibernate: WARN
